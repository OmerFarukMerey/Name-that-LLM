[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntl"
version = "0.1.0"
description = "Solution code for the Kaggle 'Name That LLM' competition"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "kaggle"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
